<title>AZote</title>
<style>
/* Layout 1.11: painel Hoje + barra de baixo (Hoje, Agenda, Escrever, Finanças, Pessoal). Visual Mono AMOLED. */
@font-face { font-family: "Inter"; src: url("fonts/Inter-Regular.woff") format("woff"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Inter"; src: url("fonts/Inter-Bold.woff") format("woff"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Inter"; src: url("fonts/Inter-ExtraBold.woff") format("woff"); font-weight: 800; font-display: swap; }
@font-face { font-family: "Inter Display"; src: url("fonts/InterDisplay-Black.woff") format("woff"); font-weight: 900; font-display: swap; }
:root {
  /* Mono AMOLED: preto puro, um destaque verde-limão */
  --bg: #000000; --panel: #000000; --card: #111111; --ink: #f5f5f5; --muted: #8a8a8a; --line: #1f1f1f;
  --accent: #c6f432; --accent-ink: #0b0b0b; --accent2: #c6f432; --accent2-ink: #0b0b0b; --brasa: #ff5a5a;
  --top: #000000; --top-ink: #f5f5f5; --top-muted: #8a8a8a;
  --bubble-me: #c6f432; --bubble-app: #121212; --chat-bg: #000000; --dots: #000000;
  --warn: #ffd166; --warn-bg: #2a2410; --ok: #5fe08f; --danger: #ff6b6b;
  --c-verde: #12301f; --c-verde-ink: #7fe0ad; --c-amarelo: #33300c; --c-amarelo-ink: #ffe066; --c-vermelho: #3a1616; --c-vermelho-ink: #ff9d94; --c-laranja: #2a1e0e; --c-laranja-ink: #ffb27a;
  --f-display: "Inter", system-ui, sans-serif; --f-marca: "Inter Display", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, "Segoe UI", sans-serif;
  --f-mono: "Inter", system-ui, sans-serif;
  --radius: 16px;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.raiz { height: 100%; max-width: 720px; margin: 0 auto; background: var(--panel); position: relative;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--kb, 0px)); }
.tela { display: none; height: 100%; flex-direction: column; min-height: 0; }
.raiz[data-tela="home"] #telaHome, .raiz[data-tela="recados"] #telaRecados, .raiz[data-tela="agenda"] #telaAgenda,
.raiz[data-tela="cal"] #telaCal, .raiz[data-tela="notas"] #telaNotas, .raiz[data-tela="config"] #telaConfig,
.raiz[data-tela="tarefas"] #telaTarefas, .raiz[data-tela="resumo"] #telaResumo, .raiz[data-tela="fin"] #telaFin, .raiz[data-tela="pessoal"] #telaPessoal, .raiz[data-tela="revisao"] #telaRevisao, .raiz[data-tela="plano"] #telaPlano, .raiz[data-tela="retro"] #telaRetro, .raiz[data-tela="escrever"] #telaEscrever, .raiz[data-tela="relatorio"] #telaRelatorio, .raiz[data-tela="busca"] #telaBusca { display: flex; }

/* ---------- Tela inicial ---------- */
.home-top { background: var(--top); color: var(--top-ink); padding: 14px 16px 16px; display: flex; align-items: center; gap: 10px; }
.home-top svg { width: 34px; height: 34px; border-radius: 9px; flex: none; box-shadow: 0 0 0 1px var(--line); }
.home-top h1 { margin: 0; font: 900 1.75rem/1 var(--f-marca); letter-spacing: -1.6px; }
.home-top h1 em { font-style: normal; color: var(--accent2); }

/* ---------- Cabeçalho das conversas ---------- */
.chat-top { background: var(--top); color: var(--top-ink); display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 4px; min-height: 60px; }
.voltar { border: 0; background: transparent; color: inherit; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.voltar svg { width: 22px; height: 22px; }
.az { width: 40px; height: 40px; border-radius: 50%; background: var(--accent2); color: var(--accent2-ink); display: grid; place-items: center;
  font: 900 0.95rem/1 var(--f-marca); letter-spacing: -0.5px; flex: none; }
.ct { min-width: 0; display: grid; }
.ct b { font: 700 1.08rem/1.2 var(--f-display); }
.ct small { color: var(--top-muted); font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-top .acao { margin-left: auto; border: 1px solid color-mix(in srgb, var(--top-ink) 35%, transparent); background: transparent; color: var(--top-ink);
  border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; }

/* ---------- Conversa ---------- */
.chat { flex: 1; overflow-y: auto; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 6px; background-color: var(--chat-bg);
  background-image: radial-gradient(var(--dots) 1.2px, transparent 1.2px); background-size: 18px 18px; }
.msg { max-width: 84%; padding: 7px 10px 5px; border-radius: 12px; position: relative; min-width: 0; overflow-wrap: anywhere; box-shadow: 0 1px 1px rgb(0 0 0 / 0.08); }
.msg.me { align-self: flex-end; background: var(--bubble-me); border-top-right-radius: 3px; }
.msg.app { align-self: flex-start; background: var(--bubble-app); border-top-left-radius: 3px; }
.msg p { margin: 0; white-space: pre-wrap; }
.msg .meta { font: 500 0.66rem var(--f-mono); color: var(--muted); text-align: right; margin-top: 2px; }
.msg.sel { outline: 2px solid var(--accent); }
.msg .mini { display: flex; gap: 6px; margin-top: 6px; }
.sep { align-self: center; background: var(--panel); color: var(--muted); font-size: 0.75rem; padding: 3px 10px; border-radius: 8px; margin: 6px 0; box-shadow: 0 1px 1px rgb(0 0 0 / 0.06); }
.ex { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 0.82rem; text-align: left; }
.chip.on { border-style: solid; border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.ticket { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0 0; padding-top: 8px; border-top: 1px dashed var(--line); }
.ticket dt { font: 500 0.7rem var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding-top: 2px; }
.ticket dd { margin: 0; font-weight: 700; }
.note { margin-top: 8px; font-size: 0.8rem; color: var(--warn); background: var(--warn-bg); padding: 5px 8px; border-radius: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
.dot.ok { background: var(--ok); }

.composer { display: flex; align-items: flex-end; gap: 8px; padding: 8px; background: var(--chat-bg); }
.composer input, .composer textarea { flex: 1; min-width: 0; border: 0; border-radius: 24px; padding: 11px 16px; background: var(--panel); box-shadow: 0 1px 1px rgb(0 0 0 / 0.08); }
.composer textarea { resize: none; max-height: 140px; line-height: 1.35; }
.composer button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }

/* ---------- Agenda ---------- */
.corpo { flex: 1; overflow-y: auto; padding: 4px 16px 20px; background: var(--panel); }
.empty { color: var(--muted); padding: 24px 4px; }
.empty b { color: var(--ink); }
.day { margin-top: 14px; }
.day-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.day-h .d { font: 700 1.6rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.day-h .w { font-weight: 700; }
.day-h .rel { font: 500 0.72rem var(--f-mono); color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; margin-left: auto; }
.ev { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 4px 10px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.ev:last-child { border-bottom: 0; }
.ev .t { font: 500 0.95rem var(--f-mono); font-variant-numeric: tabular-nums; }
.ev .t small { color: var(--muted); }
.ev .ti { font-weight: 700; overflow-wrap: anywhere; }
.ev .sub { font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 3px; }
.ev.past { opacity: 0.55; }
.ev.soon .t { color: var(--accent); }
.ev.trab .ti { color: var(--c-laranja-ink); }
.ev-actions { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font: 500 0.7rem var(--f-mono); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); }
.pill.on { border-color: var(--accent); color: var(--accent); }
.pill.rep { border-color: var(--ok); color: var(--ok); }
.pill.trab { border-color: var(--c-laranja-ink); color: var(--c-laranja-ink); }
.icon-btn { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 9px; font-size: 0.78rem; }
.toggle-past { margin-top: 14px; }

/* ---------- Calendário ---------- */
.cal-nav { display: flex; align-items: center; gap: 6px; padding: 10px 12px 4px; background: var(--panel); }
.cal-nav #calMes { flex: 1; text-align: center; font: 700 1.05rem var(--f-display); text-transform: capitalize; }
.nav { border: 1px solid var(--line); background: transparent; border-radius: 8px; width: 36px; height: 36px; font-size: 1.2rem; line-height: 1; }
.cal-wrap { flex: 1; overflow-y: auto; padding: 6px 12px 20px; background: var(--panel); }
.cal-sem, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-sem span { text-align: center; font: 500 0.72rem var(--f-mono); color: var(--muted); padding-bottom: 4px; }
.cel { aspect-ratio: 1 / 1.05; max-width: 100%; border: 1px solid transparent; border-radius: 10px; padding: 4px 2px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1px; background: var(--bg); font-variant-numeric: tabular-nums; }
.cel .n { font: 700 1rem/1 var(--f-display); }
.cel .h { font: 400 0.62rem var(--f-mono); opacity: 0.85; }
.cel .v { font-style: normal; font-size: 0.56rem; font-weight: 800; padding: 0 3px; border-radius: 4px; }
.cel.verde { background: var(--c-verde); color: var(--c-verde-ink); }
.cel.amarelo { background: var(--c-amarelo); color: var(--c-amarelo-ink); }
.cel.vermelho { background: var(--c-vermelho); color: var(--c-vermelho-ink); }
.cel.laranja { background: var(--c-laranja); color: var(--c-laranja-ink); border: 2px dashed var(--c-laranja-ink); }
.cel.passado { opacity: 0.45; }
.cel.hoje-c { border-color: var(--ink); }
.cel.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.cel.vazio { background: transparent; cursor: default; }
.legenda { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 0.78rem; color: var(--muted); margin-top: 12px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda .obs { grid-column: 1 / -1; font-size: 0.72rem; line-height: 1.4; }
.escala-barra { grid-column: 1 / -1; height: 12px; border-radius: 6px;
  background: linear-gradient(90deg, #2a2f3d 0%, #3f4a4a 16%, #6b6a3a 33%, #a8842e 50%, #e0a62a 66%, #ff7a3d 82%, #ff4d4d 94%, #ff2e4d 100%); }
.escala-rot { grid-column: 1 / -1; position: relative; height: 1.1em; font-size: 0.72rem; margin-top: -2px; }
.escala-rot span { position: absolute; left: 0; white-space: nowrap; }
.escala-rot span:nth-child(2) { transform: translateX(-50%); }
.escala-rot span:last-child { left: auto; }
.sw.laranja { border-style: dashed; }
.sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; flex: none; }
.sw.verde { background: var(--c-verde); border: 1px solid var(--c-verde-ink); }
.sw.amarelo { background: var(--c-amarelo); border: 1px solid var(--c-amarelo-ink); }
.sw.vermelho { background: var(--c-vermelho); border: 1px solid var(--c-vermelho-ink); }
.sw.laranja { background: var(--c-laranja); border: 1px solid var(--c-laranja-ink); }
.cal-dia { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.cal-dia h3 { margin: 0 0 4px; font: 700 1.05rem var(--f-display); }
.cal-dia .resumo { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
.cal-dia .resumo b { color: var(--ink); }
.slot { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); align-items: baseline; }
.slot .t { font: 500 0.85rem var(--f-mono); font-variant-numeric: tabular-nums; }
.slot.livre .t, .slot.livre .d { color: var(--c-verde-ink); }
.slot.trab .t, .slot.trab .d button { color: var(--c-laranja-ink); }
.slot .d { overflow-wrap: anywhere; }
.slot button { all: unset; cursor: pointer; font-weight: 700; }

/* ---------- Edição ---------- */
.overlay { position: fixed; inset: 0; background: rgb(10 6 20 / 0.5); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); width: min(420px, 100%); padding: 18px; display: grid; gap: 12px; max-height: calc(100% - 32px); overflow-y: auto; }
.sheet h3 { margin: 0; font: 700 1.1rem var(--f-display); }
.field { display: grid; gap: 4px; }
.field label { font: 500 0.72rem var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.field input, .field select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--bg); width: 100%; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.check small { display: block; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet.ocorrencia .so-serie { display: none; }

/* ---------- Abas e filtro de dias ---------- */
.abas { display: flex; gap: 6px; padding: 0 12px 10px; background: var(--top); border-bottom: 1px solid var(--line); }
.abas button { flex: 1; border: 0; padding: 9px 0; border-radius: 10px; font-weight: 700; font-size: 0.88rem; color: var(--muted); background: var(--card); }
.abas button.on { background: var(--accent); color: var(--accent-ink); }
.dias { display: flex; gap: 6px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.dias::-webkit-scrollbar { display: none; }
.dias button { flex: none; width: 44px; border: 0; border-radius: 12px; background: var(--card); color: var(--muted); padding: 5px 0 7px; position: relative; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.03em; }
.dias button b { display: block; font-size: 1rem; color: var(--ink); text-transform: none; letter-spacing: 0; }
.dias button.on { background: var(--accent); color: var(--accent-ink); }
.dias button.on b { color: var(--accent-ink); }
.dias button i { position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.dias button.on i { background: var(--accent-ink); }
.dias button.tudo { width: auto; padding: 0 12px; font-size: 0.78rem; font-weight: 800; text-transform: none; letter-spacing: 0; }
.dias button.calbtn { width: 44px; display: grid; place-items: center; color: var(--accent); }
.dias button.fora b { font-size: 0.82rem; }
.seletor { gap: 10px; }
.sel-top { display: flex; align-items: center; justify-content: space-between; }
.sel-top b { font: 700 1.05rem var(--f-body); text-transform: capitalize; }
.sel-sem, .sel-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.sel-sem span { text-align: center; font-size: 0.7rem; color: var(--muted); }
.sel-grid button { position: relative; aspect-ratio: 1; border: 0; border-radius: 10px; background: var(--card); color: var(--ink); font-weight: 700; font-size: 0.95rem; }
.sel-grid button.pas { color: var(--muted); }
.sel-grid button.hoje { box-shadow: inset 0 0 0 2px var(--ink); }
.sel-grid button.on { background: var(--accent); color: var(--accent-ink); }
.sel-grid button i { position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.sel-grid button.on i { background: var(--accent-ink); }
/* ---------- Categorias ---------- */
.pill.cat { border: 0; color: #14161f; font-weight: 700; }
/* ---------- Tarefas ---------- */
.grp { font: 700 0.68rem var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin: 16px 0 4px; }
.tf { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.tf .ck { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--accent); background: transparent; flex: none; display: grid; place-items: center; color: var(--accent-ink); font-size: 0.8rem; font-weight: 900; padding: 0; }
.tf .ck.ok { background: var(--ok); border-color: var(--ok); }
.tf .tc { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 0; }
.tf .tt { font-weight: 700; overflow-wrap: anywhere; }
.tf small { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
.tf.urg small.pz { color: var(--danger); font-weight: 700; }
.tf.feita .tt { text-decoration: line-through; color: var(--muted); }
.tf .mini { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
/* ---------- Resumo ---------- */
.semnav { margin-left: auto; display: flex; gap: 6px; }
.semnav .acao { margin: 0; width: 34px; padding: 4px 0; font-size: 1rem; }
.kp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.kp div { background: var(--card); border-radius: 12px; padding: 10px; }
.kp b { font: 900 1.4rem/1 var(--f-marca); letter-spacing: -0.5px; display: block; }
.kp small { font-size: 0.7rem; color: var(--muted); line-height: 1.25; display: block; margin-top: 4px; }
.barra { margin: 10px 0; border: 0; background: transparent; width: 100%; padding: 0; text-align: left; display: block; }
.barra .bl { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; }
.barra .bl b { margin-left: auto; font-weight: 700; } .barra .bl b small { color: var(--muted); font-weight: 400; }
.barra .sq { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.barra .bt { height: 9px; background: var(--card); border-radius: 5px; margin-top: 5px; overflow: hidden; }
.barra .bt div { height: 100%; border-radius: 5px; }
.barra > small { font-size: 0.74rem; color: var(--muted); }
.barra > small.ok { color: var(--ok); }
.txt { font-size: 0.9rem; margin: 2px 0; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 6px 0; }
.stepper span { font: 900 2rem/1 var(--f-marca); min-width: 80px; text-align: center; }
.stepper .nav { width: 48px; height: 48px; font-size: 1.5rem; border-radius: 14px; }
.livres-dia { margin-top: 14px; }
.livres-dia h4 { margin: 0 0 6px; font: 700 0.7rem var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.livres-dia div { color: var(--c-verde-ink); font-size: 0.88rem; line-height: 1.7; }

/* ---------- Folha de opções (compromisso repetido) ---------- */
.overlay.baixo { place-items: end center; padding: 0; }
.folha { background: var(--panel); width: min(720px, 100%); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 24px rgb(0 0 0 / 0.18);
  padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.folha .alca { width: 40px; height: 4px; border-radius: 2px; background: var(--line); justify-self: center; margin-bottom: 6px; }
.folha b { font: 700 1.1rem var(--f-display); }
.folha small { color: var(--muted); margin-bottom: 4px; }
.op { padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-weight: 700; text-align: left; }
.op:first-of-type { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.op.perigo { color: var(--danger); }
.op.perigo.armed { background: var(--danger); color: #fff; border-color: var(--danger); }

/* ---------- Conflito, backup ---------- */
.alerta { color: var(--danger); margin-bottom: 4px !important; }
.dica { color: var(--muted); font-size: 0.8rem; margin-top: 6px !important; }
.pill.pulado { border-color: var(--muted); color: var(--muted); }
.pill.mudado { border-color: var(--accent); color: var(--accent); border-style: dashed; }
.ev.pulado .ti { text-decoration: line-through; color: var(--muted); }
